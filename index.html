<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Shift Calendar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="./mdl/material.min.css">
    <link rel="stylesheet" href="./styles.css">
</head>

<body>

<div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
    <header class="mdl-layout__header">
        <div class="mdl-layout__header-row">
            <button id="btnShift" class="mdl-button"></button>
            <div class="mdl-layout-spacer"></div>
            <button id="btnHome" class="mdl-button">Home</button>
            <button id="btnAbout" class="mdl-button">About</button>
        </div>
    </header>

    <main class="mdl-layout__content">
        <div class="ph-scroller-wrapper"></div>
    </main>

    <div id="modalShift" class="modal"></div>
    <div id="modalAbout" class="modal"></div>
    <div class="mdl-layout__obfuscator"></div>

    <template>
        <div class="ph-month">
            <header></header>
            <ul class="weekdays"></ul>
            <ul class="day-grid"></ul>
        </div>
        <li class="month-prev"></li>
        <li class="month-curr">1</li>
    </template>
</div>

<script src="./loadJS.js"></script>
<script src="./mdl/material.min.js"></script>

<script>
    loadJS("./shifts.js", true);
    loadJS("./main.js", true);
    loadJS("./upup.min.js", true);
    loadJS("./pwa.js", true);
</script>

</body>
</html>
